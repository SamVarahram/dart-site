name: Publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kör tester
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Plocka ihop sidan
        run: |
          mkdir _site
          cp index.html favicon.svg manifest.webmanifest _site/
          cp -R css js _site/
      - name: Konfigurera Pages
        uses: actions/configure-pages@v5
      - name: Ladda upp
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
